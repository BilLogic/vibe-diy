<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maven Course Page — Design Variations</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background: #0f0f0f;
        }

        /* SWITCHER BAR */
        .switcher {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(20, 20, 20, 0.92);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 100px;
            padding: 6px 8px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .switcher-label {
            font-size: 11px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 0 8px;
            white-space: nowrap;
        }

        .switcher-sep {
            width: 1px;
            height: 20px;
            background: rgba(255, 255, 255, 0.1);
        }

        .var-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 7px 16px;
            border-radius: 100px;
            border: none;
            background: transparent;
            color: rgba(255, 255, 255, 0.55);
            font-size: 12px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .var-btn:hover {
            color: rgba(255, 255, 255, 0.85);
            background: rgba(255, 255, 255, 0.06);
        }

        .var-btn.active {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
        }

        .var-btn.active.va {
            background: rgba(29, 205, 179, 0.2);
            color: #1dcdb3;
        }

        .var-btn.active.vb {
            background: rgba(13, 148, 136, 0.2);
            color: #0d9488;
        }

        .var-btn.active.vc {
            background: rgba(100, 116, 139, 0.2);
            color: #94a3b8;
        }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .dot-a {
            background: #1dcdb3;
        }

        .dot-b {
            background: #0d9488;
        }

        .dot-c {
            background: #94a3b8;
        }

        /* DESCRIPTION CHIP */
        .desc-chip {
            position: fixed;
            top: 68px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9998;
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 8px 16px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
            white-space: nowrap;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .desc-chip span {
            color: rgba(255, 255, 255, 0.8);
            font-weight: 600;
        }

        /* IFRAME */
        .frame-wrap {
            position: fixed;
            inset: 0;
            top: 0;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: none;
        }

        iframe.active {
            display: block;
        }

        /* FADE TRANSITION */
        .frame-wrap {
            transition: opacity 0.25s;
        }

        .frame-wrap.fading {
            opacity: 0;
        }
    </style>
</head>

<body>

    <div class="switcher">
        <span class="switcher-label">Variation</span>
        <div class="switcher-sep"></div>
        <button class="var-btn va active" onclick="switchTo('a', this)">
            <span class="dot dot-a"></span>A · Bold Editorial
        </button>
        <button class="var-btn vb" onclick="switchTo('b', this)">
            <span class="dot dot-b"></span>B · Clean & Airy
        </button>
        <button class="var-btn vc" onclick="switchTo('c', this)">
            <span class="dot dot-c"></span>C · Structured Pro
        </button>
    </div>

    <div class="desc-chip" id="desc">
        <span id="desc-name">A · Bold Editorial</span> — Dark teal, premium editorial, high contrast
    </div>

    <div class="frame-wrap" id="frameWrap">
        <iframe id="frame-a" class="active" src="variation-a.html" title="Variation A: Bold Editorial"></iframe>
        <iframe id="frame-b" src="variation-b.html" title="Variation B: Clean & Airy"></iframe>
        <iframe id="frame-c" src="variation-c.html" title="Variation C: Structured Pro"></iframe>
    </div>

    <script>
        const descriptions = {
            a: { name: 'A · Bold Editorial', desc: 'Dark teal, premium editorial, high contrast' },
            b: { name: 'B · Clean & Airy', desc: 'Light background, welcoming, modern editorial' },
            c: { name: 'C · Structured Pro', desc: 'Information-dense, functional, efficient' },
        };

        let current = 'a';

        function switchTo(v, btn) {
            if (v === current) return;
            const wrap = document.getElementById('frameWrap');
            wrap.classList.add('fading');
            setTimeout(() => {
                // hide all
                document.querySelectorAll('iframe').forEach(f => f.classList.remove('active'));
                document.querySelectorAll('.var-btn').forEach(b => b.classList.remove('active'));
                // show target
                document.getElementById('frame-' + v).classList.add('active');
                btn.classList.add('active');
                // update description
                const d = descriptions[v];
                document.getElementById('desc-name').textContent = d.name;
                document.getElementById('desc').innerHTML = `<span id="desc-name">${d.name}</span> — ${d.desc}`;
                current = v;
                wrap.classList.remove('fading');
            }, 200);
        }
    </script>
</body>

</html>
